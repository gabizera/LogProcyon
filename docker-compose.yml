# LogProcyon — deploy de produção (Docker Compose, NÃO Swarm).
# Swarm não lida bem com IPv6; o caminho oficial é `docker compose up -d --build`.
# TLS é terminado por um reverse-proxy externo na frente (este compose só
# expõe o frontend numa porta interna configurável via FRONTEND_PORT).
# Variáveis obrigatórias ficam em .env (ver .env.example).
name: logprocyon

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: log-clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD obrigatório no .env}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - lognet
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  collector:
    image: logprocyon-collector:latest
    build:
      context: ./collector
    container_name: log-collector
    # host networking: o collector bind o range dedicado 20000-20199/udp
    # direto e enxerga o IP de origem real (2ª camada source_ip).
    network_mode: host
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_URL=http://localhost:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD obrigatório no .env}
      - LISTEN_PORT=514
      - BATCH_SIZE=100
      - FLUSH_INTERVAL=2000
      - TZ_OFFSET_HOURS=${TZ_OFFSET_HOURS:--3}
      - DATA_DIR=/data
    volumes:
      - logdata:/data
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8123/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  backend:
    image: logprocyon-backend:latest
    build:
      context: ./backend
    container_name: log-backend
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD obrigatório no .env}
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET obrigatório no .env (mín. 32 chars)}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS obrigatório (domínio https público)}
      - MULTI_TENANT_MODE=${MULTI_TENANT_MODE:-false}
    volumes:
      - logdata:/data
    networks:
      - lognet
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  frontend:
    image: logprocyon-frontend:latest
    build:
      context: ./frontend
    container_name: log-frontend
    # Atrás do reverse-proxy externo que termina TLS. FRONTEND_PORT é a
    # porta interna que o proxy encaminha (default 80).
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - lognet
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

volumes:
  clickhouse_data:
    driver: local
  logdata:
    driver: local

networks:
  lognet:
    driver: bridge
