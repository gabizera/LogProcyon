# LogProcyon — deploy de produção (Docker Compose, NÃO Swarm).
# Swarm não lida bem com IPv6; o caminho oficial é `docker compose up -d --build`.
# TLS é terminado por um reverse-proxy externo na frente (este compose só
# expõe o frontend numa porta interna configurável via FRONTEND_PORT).
# Variáveis obrigatórias ficam em .env (ver .env.example).
name: logprocyon

# Rotação de log dos containers (json-file): teto por container e compressão
# na rotação. Sem isto o stdout do container vira um json.log sem limite — foi
# o que encheu o disco (46 GB só do collector). 20m x 5 = 100 MB/container máx.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: log-clickhouse
    logging: *default-logging
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD obrigatório no .env}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # TTL nas tabelas internas (system.*_log). Sem isto text_log/query_log/etc
      # crescem sem limite — chegaram a ~11 GB neste deploy.
      - ./clickhouse/config.d/clickhouse-logs.xml:/etc/clickhouse-server/config.d/clickhouse-logs.xml:ro
      # Teto de memória (< mem_limit 3g) — evita OOM-kill, dá erro gracioso.
      - ./clickhouse/users.d/memory.xml:/etc/clickhouse-server/users.d/memory.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - lognet
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  collector:
    image: logprocyon-collector:latest
    build:
      context: ./collector
    container_name: log-collector
    logging: *default-logging
    # host networking: o collector bind o range dedicado 20000-20199/udp
    # direto e enxerga o IP de origem real (2ª camada source_ip).
    network_mode: host
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_URL=http://localhost:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD obrigatório no .env}
      - LISTEN_PORT=514
      - BATCH_SIZE=100
      - FLUSH_INTERVAL=2000
      # Log por tradução NAT no stdout (MUITO verboso — uma linha por conexão).
      # Default off; ligue só para depurar um equipamento específico.
      - LOG_EVENTS=${LOG_EVENTS:-false}
      - TZ_OFFSET_HOURS=${TZ_OFFSET_HOURS:--3}
      - DATA_DIR=/data
    volumes:
      - logdata:/data
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8123/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  backend:
    image: logprocyon-backend:latest
    build:
      context: ./backend
    container_name: log-backend
    logging: *default-logging
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD obrigatório no .env}
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET obrigatório no .env (mín. 32 chars)}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS obrigatório (domínio https público)}
      - MULTI_TENANT_MODE=${MULTI_TENANT_MODE:-false}
    volumes:
      - logdata:/data
    networks:
      - lognet
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  frontend:
    image: logprocyon-frontend:latest
    build:
      context: ./frontend
    container_name: log-frontend
    logging: *default-logging
    # Atrás do reverse-proxy externo que termina TLS. FRONTEND_PORT é a
    # porta interna que o proxy encaminha (default 80).
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - lognet
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      # 127.0.0.1, não localhost: dentro do nginx:alpine "localhost" não resolve
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped

volumes:
  clickhouse_data:
    driver: local
  logdata:
    driver: local

networks:
  lognet:
    driver: bridge
